# ────────────────────────────────────────────────────────────────
# Kastor — build da imagem Docker e push pro GHCR (GitHub Container Registry)
#
# Dispara em todo push na main. A imagem publicada é a que o docker-compose.yml
# em produção referencia (ghcr.io/<owner>/kastor:<sha>).
#
# Fluxo do deploy:
#   1. Build + push da imagem no GHCR com dois tags: :latest e :<sha>
#   2. Reescreve docker-compose.yml pra apontar pro :<sha> desse commit
#   3. Commita e faz push (com [skip ci] pra NÃO retriggar o workflow)
#   4. Dispara webhook do Portainer → Portainer faz git pull, vê tag novo,
#      Swarm re-puxa a imagem do GHCR e faz update do serviço.
#
# Por que reescrever o tag? O webhook de STACK do Portainer roda "stack deploy"
# usando cache local — se o tag continua :latest, Swarm não puxa a nova imagem.
# Trocando pra SHA único a cada commit, Swarm é forçado a puxar do registry.
#
# Permissões:
#   - contents: write     → clonar o repo E commitar o compose com tag novo
#   - packages: write     → publicar no ghcr.io (usa GITHUB_TOKEN automático)
#
# Cache:
#   - type=gha (GitHub Actions cache) — camadas do Docker sobrevivem entre runs,
#     builds seguintes ficam em ~30-60s (só reinstala npm se package.json mudou).
# ────────────────────────────────────────────────────────────────
name: Build and Push to GHCR

on:
  push:
    branches:
      - main

# Evita que dois deploys rodem em paralelo e briguem pelo git push.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Persist token pra permitir git push depois.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR exige o path em lowercase. Se o dono do repo tem letra maiúscula
      # no username/org, ${GITHUB_REPOSITORY} traz maiúsculas e o push falha.
      # Downcase antes de usar.
      - name: Downcase Repository Name
        run: |
          echo "REPO_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # BUILD_SHA: passa o SHA do commit pra dentro da imagem — build-prod.js
          # usa pra reescrever cache-busters e o server expõe em /api/health.
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.REPO_NAME }}:latest
            ghcr.io/${{ env.REPO_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Reescreve a linha `image:` do compose pra apontar pro SHA desse commit.
      # Regex captura qualquer variação (${GITHUB_REPOSITORY_OWNER}/kastor:latest,
      # andrigooliveira/kastor:<sha antigo>, etc.) e normaliza pra REPO_NAME:SHA.
      - name: Pin image tag to commit SHA
        run: |
          sed -i -E "s|image: ghcr\.io/[^[:space:]]+/kastor:[^[:space:]]+|image: ghcr.io/${REPO_NAME}:${GITHUB_SHA}|" docker-compose.yml
          echo "--- Diff no docker-compose.yml ---"
          git --no-pager diff docker-compose.yml || true

      # Commita o compose atualizado. [skip ci] previne loop (o próprio workflow
      # não redispara em push do GITHUB_TOKEN, mas o marcador é seguro extra).
      # Se nada mudou (raro, mas possível se dois commits pegarem o mesmo estado),
      # apenas segue.
      - name: Commit pinned compose
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet docker-compose.yml; then
            echo "docker-compose.yml já estava no SHA atual — nada pra commitar."
            exit 0
          fi
          SHORT_SHA="${GITHUB_SHA:0:7}"
          git add docker-compose.yml
          git commit -m "deploy: pin image to ${SHORT_SHA} [skip ci]"
          git push

      # Dispara o webhook do Portainer. Como o commit acima já foi pro main,
      # o git pull do Portainer vai pegar o compose com o SHA novo.
      # Configurar no Portainer: Stacks → kastor → Webhook, e cole a URL no
      # secret PORTAINER_WEBHOOK_URL do repo. Se o secret não existir, pula.
      - name: Trigger Portainer redeploy
        if: ${{ success() && env.PORTAINER_WEBHOOK_URL != '' }}
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          curl -fsSL -X POST --max-time 30 "$PORTAINER_WEBHOOK_URL"
          echo "Portainer webhook disparado."

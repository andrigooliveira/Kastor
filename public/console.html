<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0b0d">
  <title>reWork Console</title>
  <link rel="icon" href="/rework_logo.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/fonts.css?v=1">
  <!-- Tema salvo antes do primeiro paint (padrão: escuro). -->
  <script>
    (function () {
      var t = 'dark';
      try { t = localStorage.getItem('rework-console-theme') || 'dark'; } catch (_) {}
      document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    })();
  </script>
  <link rel="stylesheet" href="/css/console.css?v=20260925c11">
</head>
<body>
  <div id="app" aria-live="polite">
    <div class="c-boot"><img src="/rework_logo.svg" alt="" width="36" height="36"></div>
  </div>
  <div class="c-toasts" id="c-toasts" role="status" aria-live="polite"></div>
  <script src="/vendor/lucide.min.js"></script>
  <script src="/js/console.js?v=20260925c12"></script>
</body>
</html>

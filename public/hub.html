<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#7A00FF">
  <title>reWork Hub</title>
  <link rel="icon" href="/reworkhub_simbol.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/fonts.css?v=1">

  <!-- Aplica tema salvo antes de renderizar pra evitar flash. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('kastor-theme');
        if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
        else if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      } catch (_) {}
    })();
  </script>

  <link rel="stylesheet" href="/css/style.css?v=20260924hub9">

  <style>
    /* O Hub usa a mesma linguagem da plataforma: topbar, saudação da Início,
       títulos de seção com hairline, botões .btn e cards com borda fina.
       Só o que é próprio do Hub (cards de app e miniaturas) fica aqui. */
    html, body { margin: 0; padding: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    [hidden] { display: none !important; }
    a.btn { text-decoration: none; }

    .hub-app { display: flex; flex-direction: column; min-height: 100vh; }

    /* ── Topbar (mesma da plataforma) ── */
    .hub-topbar { gap: 4px; position: sticky; top: 0; }
    .hub-topbar .topbar-back { margin-right: 14px; text-decoration: none; }
    .hub-brand { display: inline-flex; align-items: center; }
    .hub-brand img { display: block; height: 26px; width: auto; }
    .hub-icon-btn { width: 36px; height: 36px; padding: 0; justify-content: center; }
    .hub-user {
      display: flex; align-items: center; gap: 9px;
      padding-left: 12px; margin-left: 2px;
      border-left: 1px solid var(--hairline);
      font-size: 13px; font-weight: 600; color: var(--text);
    }
    .hub-user-avatar {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; overflow: hidden;
    }
    .hub-user-avatar img { width: 100%; height: 100%; object-fit: cover; }
    @media (max-width: 640px) {
      .hub-topbar { padding: 12px 16px; }
      .hub-user-name, .hub-new-label { display: none; }
      .hub-new-btn { width: 36px; height: 36px; padding: 0; justify-content: center; }
    }

    /* ── Corpo ── */
    .hub-body { flex: 1; padding: 28px 28px 56px; }
    .hub-inner { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }
    @media (max-width: 640px) { .hub-body { padding: 20px 16px 40px; } }
    .hub-greeting { margin: 0; }
    .hub-greeting .dash-greeting-sub { margin-top: 6px; }

    .hub-section { display: flex; flex-direction: column; }
    .hub-section-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      padding-bottom: 12px; margin-bottom: 16px;
      border-bottom: 1px solid var(--hairline);
    }
    .hub-section-head .dash-col-heading { margin: 0; }

    /* ── Aplicativos ── */
    /* Os ícones dos produtos já trazem nome e forma: sem card nem texto. */
    .hub-apps { display: flex; flex-wrap: wrap; gap: 20px; }
    .hub-app-card {
      display: block; width: 88px; height: 88px; border-radius: 20px;
      transition: transform .15s var(--ease-out), filter .15s var(--ease-out);
    }
    .hub-app-card img { width: 100%; height: 100%; display: block; }
    a.hub-app-card:hover { transform: translateY(-2px); filter: drop-shadow(0 10px 18px color-mix(in oklab, var(--accent) 35%, transparent)); }
    a.hub-app-card:focus-visible { outline: none; box-shadow: var(--shadow-focus); }
    .hub-app-card.is-soon { cursor: not-allowed; filter: grayscale(1); opacity: .45; }

    /* ── Documentos recentes: barra de ferramentas ── */
    .hub-tools { display: flex; align-items: center; gap: 6px; position: relative; }
    .hub-tools .btn { height: 32px; }
    .hub-tools .hub-icon-btn { width: 32px; height: 32px; }
    .hub-select svg { color: var(--text-muted); }
    .hub-menu {
      position: absolute; top: calc(100% + 6px); right: 0; z-index: 20;
      min-width: 210px; padding: 4px;
      display: flex; flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--hairline-strong);
      border-radius: var(--radius);
      box-shadow: 0 16px 40px -12px rgba(0,0,0,.28);
    }
    .hub-menu button {
      text-align: left; padding: 8px 10px;
      background: transparent; border: 0; border-radius: var(--radius-sm);
      font-family: inherit; font-size: 13px; color: var(--text); cursor: pointer;
    }
    .hub-menu button:hover { background: var(--surface-2); }
    .hub-menu button.is-selected { background: var(--accent-dim); color: var(--accent-text); font-weight: 600; }
    .hub-menu[data-for="sort"] { right: 38px; }

    /* ── Documentos recentes: grade ── */
    .hub-recent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
    @media (max-width: 640px) { .hub-recent-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
    .hub-recent-card {
      position: relative; display: flex; flex-direction: column; overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-md);
      color: inherit; text-decoration: none;
      transition: border-color .15s var(--ease-out), box-shadow .15s var(--ease-out), transform .12s var(--ease-out);
    }
    .hub-recent-card:hover {
      border-color: color-mix(in oklab, var(--accent) 45%, var(--hairline));
      box-shadow: 0 8px 22px -14px color-mix(in oklab, var(--accent) 45%, transparent);
      transform: translateY(-1px);
    }
    .hub-recent-card:focus-visible { outline: none; box-shadow: var(--shadow-focus); }
    /* Miniatura: começo da folha renderizado em tamanho real e escalado pra
       caber no card (o JS recalibra o scale conforme a largura). */
    .hub-recent-thumb {
      position: relative; aspect-ratio: 4 / 3.6; overflow: hidden;
      background: #fff; border-bottom: 1px solid var(--hairline);
    }
    .hub-recent-thumb-page {
      position: absolute; top: 0; left: 0; width: 620px;
      transform-origin: top left; transform: scale(.3);
      padding: 24px 32px; pointer-events: none;
      color: #1a1a1a; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 12px; line-height: 1.45;
    }
    .hub-recent-thumb-page * { max-width: 100%; }
    .hub-recent-thumb-page p { margin: 0 0 6px; }
    .hub-recent-thumb-page h1 { font-size: 22px; font-weight: 700; margin: 8px 0 6px; line-height: 1.2; }
    .hub-recent-thumb-page h2 { font-size: 17px; font-weight: 700; margin: 8px 0 4px; line-height: 1.25; }
    .hub-recent-thumb-page h3 { font-size: 14px; font-weight: 600; margin: 6px 0 4px; line-height: 1.3; }
    .hub-recent-thumb-page ul, .hub-recent-thumb-page ol { margin: 0 0 6px; padding-left: 20px; }
    .hub-recent-thumb-page li { margin: 0 0 2px; }
    .hub-recent-thumb-page blockquote { border-left: 3px solid #ccc; padding: 0 8px; margin: 6px 0; color: #666; }
    .hub-recent-thumb-page code { background: #f0f0f0; padding: 1px 3px; border-radius: 2px; }
    .hub-recent-thumb-page pre { background: #f5f5f5; padding: 6px 8px; border-radius: 3px; overflow: hidden; }
    .hub-recent-thumb-page a { color: #7A00FF; text-decoration: none; }
    .hub-recent-thumb-page hr { border: 0; border-top: 1px solid #e0e0e0; margin: 6px 0; }
    .hub-recent-thumb-page table { border-collapse: collapse; width: 100%; margin: 6px 0; font-size: 11px; }
    .hub-recent-thumb-page th, .hub-recent-thumb-page td { border: 1px solid #ddd; padding: 3px 5px; }
    .hub-recent-thumb.is-empty::before {
      content: ''; position: absolute; inset: 18% 14% auto 14%; height: 4px;
      background: #f0f0f0; border-radius: 2px;
      box-shadow: 0 12px 0 #f4f4f4, 0 24px 0 #f4f4f4, 0 36px 0 #f4f4f4;
    }
    .hub-recent-thumb::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 35%;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,.95));
      pointer-events: none;
    }
    .hub-recent-info { display: flex; align-items: center; gap: 10px; padding: 10px 12px; min-width: 0; }
    .hub-recent-app { width: 18px; height: 18px; flex-shrink: 0; }
    .hub-recent-app img { width: 100%; height: 100%; display: block; }
    .hub-recent-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .hub-recent-title { font-size: 13px; font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hub-recent-date { font-size: 11.5px; color: var(--text-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

    /* ── Documentos recentes: lista (linhas como as da Início) ── */
    .hub-recent-grid.is-list { display: flex; flex-direction: column; gap: 0; }
    .hub-recent-grid.is-list .hub-recent-card {
      flex-direction: row; border: 0; border-radius: 0; background: transparent;
      border-bottom: 1px solid var(--hairline);
    }
    .hub-recent-grid.is-list .hub-recent-card:last-child { border-bottom: 0; }
    .hub-recent-grid.is-list .hub-recent-card:hover { transform: none; box-shadow: none; background: var(--surface-2); }
    .hub-recent-grid.is-list .hub-recent-thumb { display: none; }
    .hub-recent-grid.is-list .hub-recent-info { flex: 1; padding: 11px 8px; }
    .hub-recent-grid.is-list .hub-recent-text { flex-direction: row; align-items: baseline; justify-content: space-between; gap: 16px; }
    .hub-recent-grid.is-list .hub-recent-title { font-size: 13.5px; font-weight: 500; }

    .hub-recent-empty {
      grid-column: 1 / -1;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      padding: 40px 20px; text-align: center;
      font-size: 13px; color: var(--text-muted);
      border: 1px dashed var(--hairline-strong); border-radius: var(--radius-md);
    }
    .hub-skel { border: 1px solid var(--hairline); border-radius: var(--radius-md); overflow: hidden; background: var(--surface); }
    .hub-skel-thumb { aspect-ratio: 4 / 3.6; background: var(--surface-2); }
    .hub-skel-line { height: 10px; margin: 12px; width: 60%; border-radius: 4px; background: var(--surface-2); }

    /* ── Estados de entrada / login ── */
    .hub-auth-wall {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px; padding: 24px; text-align: center;
    }
    .hub-auth-wall h2 { font-size: 22px; letter-spacing: -.02em; margin: 0; color: var(--text); }
    .hub-auth-wall p { color: var(--text-muted); font-size: 14px; max-width: 360px; margin: 0; }
    .hub-auth-wall .btn { text-decoration: none; }
    .hub-boot {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; color: var(--text-muted); font-size: 13px;
    }
    .hub-spinner {
      width: 26px; height: 26px; border-radius: 50%;
      border: 2.5px solid var(--accent-dim); border-top-color: var(--accent);
      animation: hub-spin 800ms linear infinite;
    }
    @keyframes hub-spin { to { transform: rotate(360deg); } }

    @keyframes hubIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .hub-section { animation: hubIn .5s var(--ease-out) both; }
    .hub-section:nth-child(2) { animation-delay: 60ms; }
    .hub-section:nth-child(3) { animation-delay: 120ms; }
    @media (prefers-reduced-motion: reduce) { .hub-section { animation: none; } }
  </style>
</head>
<body>

  <div id="hub-boot" class="hub-boot">
    <div class="hub-spinner"></div>
    <div>Carregando reWork Hub…</div>
  </div>

  <div id="hub-auth-wall" class="hub-auth-wall" hidden>
    <img src="/reworkhub_simbol.svg" width="48" height="48" alt="">
    <h2>Faça login pra continuar</h2>
    <p>Você precisa estar autenticado na plataforma reWork pra abrir o Hub.</p>
    <a class="btn btn-primary" href="/">Ir pra tela de login</a>
  </div>

  <div id="hub-app" class="hub-app" hidden>
    <header class="topbar hub-topbar">
      <a class="topbar-back" href="/dashboard" title="Voltar pra plataforma" aria-label="Voltar pra plataforma">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </a>
      <div class="hub-brand">
        <img id="hub-brand-logo" src="/reworkhub_preto.svg" alt="reWork Hub">
      </div>
      <div class="topbar-actions">
        <button type="button" class="btn btn-ghost hub-icon-btn" onclick="hubToggleTheme()" title="Alternar tema" aria-label="Alternar tema">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
        <a class="btn btn-primary hub-new-btn" href="/hub/docs?novo=1" title="Novo documento">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span class="hub-new-label">Novo documento</span>
        </a>
        <div class="hub-user">
          <div class="hub-user-avatar" id="hub-user-avatar">?</div>
          <span class="hub-user-name" id="hub-user-name">—</span>
        </div>
      </div>
    </header>

    <main class="hub-body">
      <div class="hub-inner">
        <div class="dash-greeting hub-greeting">
          <span class="dash-greeting-msg" id="hub-greeting">Olá!</span>
          <div class="dash-greeting-sub">O que vamos criar hoje?</div>
        </div>

        <section class="hub-section" aria-labelledby="hub-apps-heading">
          <header class="hub-section-head">
            <h2 class="dash-col-heading" id="hub-apps-heading">Aplicativos</h2>
          </header>
          <div class="hub-apps">
            <a class="hub-app-card" href="/hub/docs" title="reWork Docs" aria-label="reWork Docs">
              <img src="/reworkdocs_icone.svg" alt="">
            </a>
            <div class="hub-app-card is-soon" title="reWork Presentations · em breve" aria-label="reWork Presentations, em breve" aria-disabled="true">
              <img src="/reworkpresentations_icone.svg" alt="">
            </div>
          </div>
        </section>

        <section class="hub-section" aria-labelledby="hub-recent-title">
          <header class="hub-section-head">
            <h2 class="dash-col-heading" id="hub-recent-title">Documentos recentes</h2>
            <div class="hub-tools">
              <button type="button" class="btn btn-ghost btn-sm hub-select" onclick="hubRecentToggleMenu('owner', event)">
                <span id="hub-recent-owner-label">Pertencem a mim</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <div class="hub-menu" id="hub-recent-owner-menu" data-for="owner" hidden>
                <button type="button" data-owner="mine">Pertencem a mim</button>
                <button type="button" data-owner="any">Qualquer pessoa</button>
                <button type="button" data-owner="shared">Compartilhados comigo</button>
              </div>
              <button type="button" class="btn btn-ghost hub-icon-btn" onclick="hubRecentToggleMenu('sort', event)" title="Ordenar" aria-label="Ordenar">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5h4M11 9h7M11 13h10M3 17l3 3 3-3M6 20V4"/></svg>
              </button>
              <div class="hub-menu" id="hub-recent-sort-menu" data-for="sort" hidden>
                <button type="button" data-sort="updated">Última modificação</button>
                <button type="button" data-sort="created">Data de criação</button>
                <button type="button" data-sort="title">Nome (A-Z)</button>
              </div>
              <button type="button" class="btn btn-ghost hub-icon-btn" id="hub-recent-view-btn" onclick="hubRecentToggleView()" title="Ver em lista" aria-label="Alternar visualização">
                <svg id="hub-recent-view-icon" width="15" height="15" viewBox="0 0 24 24"></svg>
              </button>
              <a class="btn btn-ghost btn-sm" href="/hub/docs">Ver todos</a>
            </div>
          </header>
          <div class="hub-recent-grid" id="hub-recent-grid">
            <div class="hub-skel"><div class="hub-skel-thumb"></div><div class="hub-skel-line"></div></div>
            <div class="hub-skel"><div class="hub-skel-thumb"></div><div class="hub-skel-line"></div></div>
            <div class="hub-skel"><div class="hub-skel-thumb"></div><div class="hub-skel-line"></div></div>
            <div class="hub-skel"><div class="hub-skel-thumb"></div><div class="hub-skel-line"></div></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script>
    (function () {
      'use strict';
      const $ = id => document.getElementById(id);
      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
      }
      async function api(path) {
        const r = await fetch('/api' + path, { credentials: 'same-origin' });
        if (r.status === 401) throw new Error('__unauth__');
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || ('Erro ' + r.status));
        return d;
      }
      function fmtDate(iso) {
        try {
          const d = new Date(iso);
          const now = new Date();
          if (d.toDateString() === now.toDateString()) return 'Hoje, ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
          const y = new Date(now); y.setDate(y.getDate() - 1);
          if (d.toDateString() === y.toDateString()) return 'Ontem';
          const opts = { day: '2-digit', month: 'short' };
          if (d.getFullYear() !== now.getFullYear()) opts.year = 'numeric';
          return d.toLocaleDateString('pt-BR', opts);
        } catch { return ''; }
      }
      function slugify(s) {
        return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
          .replace(/[^a-z0-9]+/g, '-').replace(/(^-+|-+$)/g, '').slice(0, 60);
      }

      // Logo do Hub conforme o tema (preto ↔ branco)
      function currentTheme() {
        return document.documentElement.getAttribute('data-theme')
          || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      }
      function syncBrandLogo() {
        const img = $('hub-brand-logo');
        if (img) img.src = currentTheme() === 'light' ? '/reworkhub_preto.svg' : '/reworkhub_branco.svg';
      }
      syncBrandLogo();

      // Tema (mesmo storage da plataforma e do Docs)
      window.hubToggleTheme = function () {
        const next = currentTheme() === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('kastor-theme', next); } catch {}
        syncBrandLogo();
      };

      function showAuthWall(msg) {
        $('hub-boot').hidden = true;
        $('hub-app').hidden = true;
        const w = $('hub-auth-wall');
        w.hidden = false;
        if (msg) w.querySelector('p').textContent = msg;
      }

      // Mesma saudação da Início da plataforma
      function greeting(first) {
        const h = new Date().getHours();
        if (h >= 23 || h < 6) return `Trabalhando tarde, ${first}?`;
        if (h < 12) return `Bom dia, ${first}!`;
        if (h < 18) return `Boa tarde, ${first}!`;
        return `Boa noite, ${first}!`;
      }

      const ICON_LIST = '<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>';
      const ICON_GRID = '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>';

      (async function boot() {
        let me;
        try {
          me = await api('/me');
          if (me.isFreelancer) return showAuthWall('Freelancers não têm acesso ao Hub.');
        } catch (e) {
          if (e.message === '__unauth__') return showAuthWall('Faça login pra continuar.');
          return showAuthWall(e.message || 'Erro ao autenticar.');
        }

        const displayName = me.name || me.username || 'Usuário';
        $('hub-user-name').textContent = displayName;
        const avatarEl = $('hub-user-avatar');
        if (me.avatar) {
          const img = document.createElement('img');
          img.src = me.avatar; img.alt = '';
          avatarEl.innerHTML = ''; avatarEl.appendChild(img);
        } else {
          avatarEl.textContent = displayName.charAt(0).toUpperCase();
        }
        $('hub-greeting').textContent = greeting(String(displayName).trim().split(/\s+/)[0]);

        $('hub-boot').hidden = true;
        $('hub-app').hidden = false;

        // ── Documentos recentes ────────────────────────────────────
        function readPref(k, def) { try { return localStorage.getItem('kastor-hub-' + k) || def; } catch { return def; } }
        function savePref(k, v) { try { localStorage.setItem('kastor-hub-' + k, v); } catch {} }

        const state = {
          owner: readPref('owner', 'mine'),        // mine | any | shared
          sort:  readPref('sort',  'updated'),     // updated | created | title
          view:  readPref('view',  'grid'),        // grid | list
          all:   null
        };
        const OWNER_LABEL = { mine: 'Pertencem a mim', any: 'Qualquer pessoa', shared: 'Compartilhados comigo' };
        const TITLE_LABEL = { updated: 'Documentos recentes', created: 'Documentos por criação', title: 'Documentos por nome' };

        function applyLabels() {
          $('hub-recent-owner-label').textContent = OWNER_LABEL[state.owner] || OWNER_LABEL.mine;
          $('hub-recent-title').textContent = TITLE_LABEL[state.sort] || TITLE_LABEL.updated;
          document.querySelectorAll('#hub-recent-owner-menu button').forEach(b => b.classList.toggle('is-selected', b.dataset.owner === state.owner));
          document.querySelectorAll('#hub-recent-sort-menu button').forEach(b => b.classList.toggle('is-selected', b.dataset.sort === state.sort));
        }
        function applyView() {
          const isList = state.view === 'list';
          $('hub-recent-grid').classList.toggle('is-list', isList);
          $('hub-recent-view-btn').title = isList ? 'Ver em grade' : 'Ver em lista';
          const ic = $('hub-recent-view-icon');
          ic.setAttribute('fill', 'none'); ic.setAttribute('stroke', 'currentColor'); ic.setAttribute('stroke-width', '2');
          ic.setAttribute('stroke-linecap', 'round'); ic.setAttribute('stroke-linejoin', 'round');
          ic.innerHTML = isList ? ICON_GRID : ICON_LIST;
          rescaleThumbs();
        }

        const MENUS = { owner: 'hub-recent-owner-menu', sort: 'hub-recent-sort-menu' };
        function closeMenus(except) { Object.values(MENUS).forEach(id => { if (id !== except) $(id).hidden = true; }); }
        window.hubRecentToggleMenu = function (which, ev) {
          ev?.stopPropagation();
          const m = $(MENUS[which]);
          closeMenus(MENUS[which]);
          m.hidden = !m.hidden;
        };
        document.addEventListener('click', e => { if (!e.target.closest('.hub-menu')) closeMenus(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenus(); });
        $('hub-recent-owner-menu').addEventListener('click', e => {
          const b = e.target.closest('button[data-owner]'); if (!b) return;
          state.owner = b.dataset.owner; savePref('owner', state.owner);
          closeMenus(); applyLabels(); renderRecent();
        });
        $('hub-recent-sort-menu').addEventListener('click', e => {
          const b = e.target.closest('button[data-sort]'); if (!b) return;
          state.sort = b.dataset.sort; savePref('sort', state.sort);
          closeMenus(); applyLabels(); renderRecent();
        });
        window.hubRecentToggleView = function () {
          state.view = state.view === 'grid' ? 'list' : 'grid';
          savePref('view', state.view);
          applyView();
        };

        // Miniatura: a folha tem largura fixa e é escalada pra caber no card.
        const THUMB_REF_WIDTH = 620;
        function rescaleThumbs() {
          document.querySelectorAll('#hub-recent-grid .hub-recent-thumb-page').forEach(page => {
            const w = page.parentElement.clientWidth;
            if (w) page.style.transform = 'scale(' + (w / THUMB_REF_WIDTH) + ')';
          });
        }
        let rsRaf;
        window.addEventListener('resize', () => { cancelAnimationFrame(rsRaf); rsRaf = requestAnimationFrame(rescaleThumbs); });

        // O card é <a> e HTML não aceita <a> aninhado: links do documento
        // viram <span> na miniatura (senão o card sai vazio).
        const stripAnchors = html => String(html || '').replace(/<a\b[^>]*>/gi, '<span>').replace(/<\/a>/gi, '</span>');

        function renderRecent() {
          const grid = $('hub-recent-grid');
          if (!state.all) return;
          let list = state.all.slice();
          if (state.owner === 'mine')   list = list.filter(d => d.ownerId === me.id);
          if (state.owner === 'shared') list = list.filter(d => d.ownerId !== me.id);
          list.sort((a, b) => {
            if (state.sort === 'title')   return (a.title || '').localeCompare(b.title || '', 'pt-BR');
            if (state.sort === 'created') return (b.createdAt || '').localeCompare(a.createdAt || '');
            return (b.updatedAt || '').localeCompare(a.updatedAt || '');
          });
          if (!list.length) {
            const msg = state.owner === 'mine' ? 'Você ainda não criou nenhum documento.'
              : state.owner === 'shared' ? 'Ninguém compartilhou documentos com você ainda.'
              : 'Nenhum documento por aqui ainda.';
            grid.innerHTML = `<div class="hub-recent-empty">${msg}${state.owner !== 'shared'
              ? '<a class="btn btn-primary btn-sm" href="/hub/docs?novo=1">Criar o primeiro</a>' : ''}</div>`;
            return;
          }
          grid.innerHTML = list.slice(0, 12).map(d => {
            const s = slugify(d.title || 'documento');
            const slug = (s ? s + '-' : '') + d.id;
            const title = String(d.title || 'Sem título');
            const thumb = stripAnchors(d.thumbHTML || '');
            return `<a class="hub-recent-card" href="/hub/docs/${esc(slug)}" title="${esc(title)}">
              <div class="hub-recent-thumb${thumb ? '' : ' is-empty'}" aria-hidden="true">
                ${thumb ? `<div class="hub-recent-thumb-page">${thumb}</div>` : ''}
              </div>
              <div class="hub-recent-info">
                <span class="hub-recent-app"><img src="/reworkdocs_icone.svg" alt=""></span>
                <span class="hub-recent-text">
                  <span class="hub-recent-title">${esc(title)}</span>
                  <span class="hub-recent-date">${esc(fmtDate(d.updatedAt || d.createdAt))}</span>
                </span>
              </div>
            </a>`;
          }).join('');
          rescaleThumbs();
          requestAnimationFrame(rescaleThumbs);
        }

        applyLabels();
        applyView();

        try {
          const docs = await api('/writer');
          state.all = docs.filter(d => !d.deletedAt);
          renderRecent();
        } catch (e) {
          $('hub-recent-grid').innerHTML = '<div class="hub-recent-empty">Não foi possível carregar os documentos. Recarregue a página pra tentar de novo.</div>';
        }
      })();
    })();
  </script>
</body>
</html>
